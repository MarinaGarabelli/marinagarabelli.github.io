<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica 1 · Tarot Evolutivo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --warm: #ede5d0;
    --gold: #b8923a;
    --gold-light: #d4aa5a;
    --dark: #1a1208;
    --brown: #5c3d1e;
    --text: #2d1f0e;
    --muted: #8a7055;
    --border: rgba(184,146,58,0.25);
    --correct-bg: #e8f5e9;
    --correct-border: #4caf50;
    --wrong-bg: #fce4e4;
    --wrong-border: #e57373;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Cormorant Garamond', serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }
  body::before {
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 10% 20%, rgba(184,146,58,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 90% 80%, rgba(92,61,30,0.07) 0%, transparent 60%);
    pointer-events:none; z-index:0;
  }

  /* PROGRESS BAR */
  .progress-wrap { position:fixed; top:0; left:0; right:0; height:4px; background:rgba(184,146,58,0.15); z-index:100; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-light)); transition:width 0.5s ease; }

  .page-wrap { position:relative; z-index:1; max-width:620px; margin:0 auto; padding:32px 20px 60px; }

  /* PANTALLA NOMBRE */
  .name-screen { text-align:center; padding:48px 0; animation:fadeUp 0.7s ease; }
  .big-icon { font-size:52px; display:block; margin-bottom:16px; animation:float 4s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .eyebrow { font-family:'Cinzel',serif; font-size:10px; letter-spacing:5px; color:var(--gold); text-transform:uppercase; display:block; margin-bottom:10px; }
  .main-title { font-family:'Cinzel',serif; font-size:26px; color:var(--dark); margin-bottom:8px; }
  .sub-title { font-size:18px; color:var(--muted); font-style:italic; margin-bottom:24px; line-height:1.5; }
  .intro-box { background:white; border:1px solid var(--border); border-radius:18px; padding:20px 24px; margin:20px 0 28px; font-size:17px; color:var(--brown); line-height:1.7; font-style:italic; }
  .name-input { width:100%; max-width:320px; background:white; border:1.5px solid var(--border); border-radius:14px; padding:14px 20px; font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--text); outline:none; text-align:center; display:block; margin:0 auto 20px; transition:all .3s; }
  .name-input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,146,58,0.1); }
  .btn-primary { background:var(--dark); color:var(--cream); border:none; border-radius:14px; padding:15px 44px; font-family:'Cinzel',serif; font-size:13px; letter-spacing:2px; cursor:pointer; transition:all .3s; }
  .btn-primary:hover { background:var(--brown); transform:translateY(-2px); }
  .btn-primary:disabled { opacity:.4; cursor:not-allowed; transform:none; }

  /* PANTALLA PREGUNTA */
  .q-screen { display:none; animation:fadeUp 0.5s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

  .q-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-top:16px; }
  .q-counter { font-family:'Cinzel',serif; font-size:11px; letter-spacing:3px; color:var(--gold); }
  .q-section { font-family:'Cinzel',serif; font-size:10px; letter-spacing:2px; color:var(--muted); text-align:right; max-width:180px; line-height:1.4; }

  .q-card { background:white; border:1px solid var(--border); border-radius:22px; padding:32px 28px; box-shadow:0 3px 24px rgba(92,61,30,0.07); }
  .q-text { font-size:22px; font-weight:600; color:var(--dark); line-height:1.4; margin-bottom:24px; }

  .options { display:flex; flex-direction:column; gap:10px; }
  .option-btn {
    background:var(--warm); border:1.5px solid rgba(184,146,58,0.2); border-radius:14px;
    padding:14px 18px; font-family:'Cormorant Garamond',serif; font-size:18px; color:var(--text);
    cursor:pointer; text-align:left; transition:all .22s; display:flex; align-items:flex-start; gap:12px; line-height:1.4;
  }
  .option-btn:hover:not(:disabled) { border-color:var(--gold); background:rgba(184,146,58,0.09); transform:translateX(4px); }
  .option-btn:disabled { cursor:default; }
  .option-letter { font-family:'Cinzel',serif; font-size:12px; color:var(--gold); font-weight:600; min-width:18px; margin-top:3px; }
  .option-btn.correct { background:var(--correct-bg); border-color:var(--correct-border); color:#1b5e20; }
  .option-btn.correct .option-letter { color:#2e7d32; }
  .option-btn.wrong { background:var(--wrong-bg); border-color:var(--wrong-border); color:#b71c1c; }
  .option-btn.wrong .option-letter { color:#c62828; }

  /* FEEDBACK */
  .feedback-box {
    display:none; margin-top:20px; border-radius:16px; padding:20px 22px;
    font-size:17px; line-height:1.6; animation:fadeUp 0.3s ease;
  }
  .feedback-box.correct { background:var(--correct-bg); border:1px solid var(--correct-border); color:#1b5e20; }
  .feedback-box.wrong { background:var(--wrong-bg); border:1px solid var(--wrong-border); color:#7f1d1d; }
  .feedback-label { font-family:'Cinzel',serif; font-size:11px; letter-spacing:2px; display:block; margin-bottom:6px; }
  .feedback-msg { font-style:italic; }

  .btn-next { display:none; margin-top:20px; width:100%; background:var(--dark); color:var(--cream); border:none; border-radius:14px; padding:15px; font-family:'Cinzel',serif; font-size:13px; letter-spacing:2px; cursor:pointer; transition:all .3s; }
  .btn-next:hover { background:var(--brown); }

  /* RESULTADO */
  .result-screen { display:none; text-align:center; padding:48px 0; animation:fadeUp 0.8s ease; }
  .result-card { background:white; border:1px solid var(--border); border-radius:24px; padding:44px 32px; box-shadow:0 4px 32px rgba(92,61,30,0.08); }
  .result-emoji { font-size:60px; display:block; margin-bottom:14px; }
  .result-title { font-family:'Cinzel',serif; font-size:21px; color:var(--dark); margin-bottom:10px; }
  .result-msg { font-size:18px; color:var(--muted); font-style:italic; line-height:1.6; margin-bottom:24px; }
  .result-stats { display:flex; justify-content:center; gap:28px; margin-bottom:28px; padding:18px; background:var(--warm); border-radius:16px; }
  .stat { text-align:center; }
  .stat-n { font-family:'Cinzel',serif; font-size:32px; color:var(--gold); display:block; }
  .stat-l { font-size:13px; color:var(--muted); }
  .btn-retry { background:var(--dark); color:var(--cream); border:none; border-radius:12px; padding:13px 28px; font-family:'Cinzel',serif; font-size:12px; letter-spacing:2px; cursor:pointer; transition:all .3s; margin-right:8px; }
  .btn-retry:hover { background:var(--brown); transform:translateY(-2px); }
  .btn-share { background:linear-gradient(135deg,#25d366,#128c4a); color:white; border:none; border-radius:12px; padding:13px 28px; font-family:'Cinzel',serif; font-size:12px; letter-spacing:2px; cursor:pointer; transition:all .3s; }
  .btn-share:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(37,211,102,.3); }

  @media(max-width:480px){
    .q-text { font-size:19px; }
    .option-btn { font-size:16px; }
    .result-stats { gap:16px; }
    .btn-retry,.btn-share { padding:12px 18px; font-size:11px; }
  }
</style>
</head>
<body>

<div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>

<div class="page-wrap">

  <!-- NOMBRE -->
  <div class="name-screen" id="nameScreen">
    <span class="big-icon">🌿</span>
    <span class="eyebrow">Tarot Evolutivo</span>
    <h1 class="main-title">Práctica 1</h1>
    <p class="sub-title">El Espíritu del Tarot Evolutivo<br>Código de Ética · Predictivo vs Evolutivo</p>
    <div class="intro-box">
      Esta es una práctica para afianzar lo aprendido.<br>
      No hay tiempo límite ni puntajes.<br>
      Explorá, reflexioná y aprendé a tu ritmo ✨
    </div>
    <span class="eyebrow" style="margin-bottom:10px">¿Cómo te llamás?</span>
    <input class="name-input" id="nameInput" type="text" placeholder="Tu nombre..." maxlength="30"/>
    <button class="btn-primary" id="btnStart" onclick="startPractica()" disabled>Comenzar la práctica</button>
  </div>

  <!-- PREGUNTA -->
  <div class="q-screen" id="qScreen">
    <div class="q-header">
      <div class="q-counter" id="qCounter">1 / 15</div>
      <div class="q-section" id="qSection"></div>
    </div>
    <div class="q-card">
      <div class="q-text" id="qText"></div>
      <div class="options" id="optionsContainer"></div>
      <div class="feedback-box" id="feedbackBox">
        <span class="feedback-label" id="feedbackLabel"></span>
        <span class="feedback-msg" id="feedbackMsg"></span>
      </div>
      <button class="btn-next" id="btnNext" onclick="nextQuestion()">Siguiente pregunta →</button>
    </div>
  </div>

  <!-- RESULTADO -->
  <div class="result-screen" id="resultScreen">
    <div class="result-card">
      <span class="result-emoji" id="resultEmoji"></span>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-stats">
        <div class="stat"><span class="stat-n" id="statC">0</span><span class="stat-l">Correctas</span></div>
        <div class="stat"><span class="stat-n" id="statR">0</span><span class="stat-l">Para repasar</span></div>
        <div class="stat"><span class="stat-n" id="statP">0%</span><span class="stat-l">Aciertos</span></div>
      </div>
      <p class="result-msg" id="resultMsg"></p>
      <button class="btn-retry" onclick="location.reload()">↺ Volver a practicar</button>
      <button class="btn-share" id="btnShare">📲 Compartir</button>
    </div>
  </div>

</div>

<script>

const LETRAS = ['A','B','C','D'];
let playerName = '';
let currentQ = 0;
let correctas = 0;

document.getElementById('nameInput').addEventListener('input', function(){
  document.getElementById('btnStart').disabled = this.value.trim().length < 2;
});
document.getElementById('nameInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && this.value.trim().length >= 2) startPractica();
});

function startPractica(){
  playerName = document.getElementById('nameInput').value.trim();
  document.getElementById('nameScreen').style.display = 'none';
  document.getElementById('qScreen').style.display = 'block';
  mostrarPregunta();
}

function mostrarPregunta(){
  const p = PREGUNTAS[currentQ];

  // Reset animación
  const qScreen = document.getElementById('qScreen');
  qScreen.style.animation = 'none';
  void qScreen.offsetWidth;
  qScreen.style.animation = 'fadeUp 0.4s ease';

  // Scroll al top suave
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Counter y sección
  document.getElementById('qCounter').textContent = `${currentQ + 1} / ${PREGUNTAS.length}`;
  document.getElementById('qSection').textContent = p.seccion;
  document.getElementById('qText').textContent = p.texto;

  // Progress
  document.getElementById('progressBar').style.width = ((currentQ / PREGUNTAS.length) * 100) + '%';

  // Opciones
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  p.opciones.forEach((op, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${LETRAS[i]}</span><span>${op}</span>`;
    btn.onclick = () => responder(i);
    container.appendChild(btn);
  });

  // Ocultar feedback y botón siguiente
  document.getElementById('feedbackBox').style.display = 'none';
  document.getElementById('btnNext').style.display = 'none';
}

function responder(idx){
  const p = PREGUNTAS[currentQ];
  const esCorrecta = idx === p.correcta;
  if(esCorrecta) correctas++;

  // Marcar opciones
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, j) => {
    btn.disabled = true;
    if(j === p.correcta) btn.classList.add('correct');
    else if(j === idx && !esCorrecta) btn.classList.add('wrong');
  });

  // Mostrar feedback
  const fb = document.getElementById('feedbackBox');
  const label = document.getElementById('feedbackLabel');
  const msg = document.getElementById('feedbackMsg');
  fb.style.display = 'block';

  if(esCorrecta){
    fb.className = 'feedback-box correct';
    label.textContent = '✅ ¡Correcto!';
    msg.textContent = p.feedbackOk;
  } else {
    fb.className = 'feedback-box wrong';
    label.textContent = '🌙 Sigamos aprendiendo...';
    msg.textContent = p.feedbackMal;
  }

  // Mostrar botón siguiente o finalizar
  const btnNext = document.getElementById('btnNext');
  btnNext.style.display = 'block';

  if(currentQ === PREGUNTAS.length - 1){
    btnNext.textContent = 'Ver mi resultado →';
  } else {
    btnNext.textContent = 'Siguiente pregunta →';
  }
}

function nextQuestion(){
  currentQ++;
  if(currentQ < PREGUNTAS.length){
    mostrarPregunta();
  } else {
    mostrarResultado();
  }
}

function mostrarResultado(){
  document.getElementById('qScreen').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';

  const pct = Math.round((correctas / PREGUNTAS.length) * 100);
  let emoji, titulo, msg;

  if(pct >= 90){
    emoji = '🔮'; titulo = '¡Maestra del Espíritu Evolutivo!';
    msg = `${playerName}, tu comprensión del código ético y la filosofía evolutiva es profunda. Estás más que lista para acompañar consultantes con consciencia y amor.`;
  } else if(pct >= 70){
    emoji = '🌿'; titulo = '¡Muy bien, vas por buen camino!';
    msg = `${playerName}, vas internalizando muy bien los conceptos. Repasá las preguntas donde te equivocaste y verás cómo todo se asienta con naturalidad.`;
  } else if(pct >= 50){
    emoji = '🌙'; titulo = 'Seguís aprendiendo y eso es hermoso';
    msg = `${playerName}, el camino del Tarot Evolutivo se recorre con paciencia. Volvé a las diapositivas de la Clase 1 y después repetí esta práctica.`;
  } else {
    emoji = '✨'; titulo = 'Todo comienza con el primer paso';
    msg = `${playerName}, como El Loco que inicia su viaje, estás en el comienzo. Revisá las diapositivas con calma y volvé cuando te sientas lista.`;
  }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = titulo;
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('statC').textContent = correctas;
  document.getElementById('statR').textContent = PREGUNTAS.length - correctas;
  document.getElementById('statP').textContent = pct + '%';

  document.getElementById('btnShare').onclick = () => {
    const url = window.location.href;
    const texto = `🌿 Hice la *Práctica 1 del Taller de Tarot Evolutivo*\n\n✅ ${correctas}/${PREGUNTAS.length} respuestas correctas\n🌟 ${pct}% de aciertos\n\n¿Lo hacés vos también?\n${url}`;
    window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
  };

  document.getElementById('resultScreen').style.display = 'block';
  window.scrollTo({top: 0, behavior: 'smooth'});
}
</script>
</body>
</html>
